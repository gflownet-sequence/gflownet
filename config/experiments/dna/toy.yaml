# @package _global_
# A Toy environment trained with the Uniform proxy and the TB loss

defaults:
  - override /env: sequences/dna
  - override /gflownet: trajectorybalance
  - override /loss: trajectorybalance
  - override /proxy: dna_toy
  - override /logger: wandb

# Buffer
buffer:
  test:
    type: random
    n: 1000

# GFlowNet hyperparameters
gflownet:
  random_action_prob: 0.1
  optimizer:
    batch_size:
      forward: 10
    lr: 0.001
    z_dim: 8
    lr_z_mult: 100
    n_train_steps: 1000

# Policy
policy:
  forward:
    type: mlp
    n_hid: 64
    n_layers: 2
  backward:
    shared_weights: True

# WandB
logger:
  do:
    online: False
  lightweight: True
  project_name: "dna_toy"
  run_name: "DNA-toy TB"
  tags: 
    - gflownet
    - toy

# Evaluator
evaluator:
  first_it: True
  period: 10
  n: 100
  checkpoints_period: 500

# Hydra
hydra:
  run:
    dir: ${user.logdir.root}/dna_toy/${now:%Y-%m-%d_%H-%M-%S_%f}
